<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Callback - Wize Invoice</title>
    <link rel="stylesheet" href="css/base.css">
    <style>
        .callback-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa, #e9ecef);
        }
        .callback-card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            max-width: 460px;
            width: 90%;
        }
        .callback-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }
        .callback-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #111;
        }
        .callback-message {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .callback-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #0F5C4B;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .spin {
            width: 20px;
            height: 20px;
            border: 2px solid #e5e7eb;
            border-top-color: #0F5C4B;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn-dashboard {
            display: inline-block;
            background: #0F5C4B;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .btn-dashboard:hover { background: #0a4035; }
        .error-state { color: #dc2626; }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="callback-card">
            <span class="callback-icon" id="callback-icon">⏳</span>
            <div class="callback-title" id="callback-title">Verifying Payment...</div>
            <div class="callback-message" id="callback-message">
                Please wait while we confirm your payment with Paystack.
            </div>
            <div class="callback-spinner" id="callback-spinner">
                <div class="spin"></div>
                <span>Processing...</span>
            </div>
            <div id="callback-action" style="display:none;"></div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async function () {
        const BACKEND_URL = 'https://localhost:7010';

        const iconEl    = document.getElementById('callback-icon');
        const titleEl   = document.getElementById('callback-title');
        const msgEl     = document.getElementById('callback-message');
        const spinnerEl = document.getElementById('callback-spinner');
        const actionEl  = document.getElementById('callback-action');

        function showSuccess(plan) {
            iconEl.textContent    = '🎉';
            titleEl.textContent   = 'Payment Successful!';
            msgEl.textContent     = `Welcome to Wize Invoice Premium${plan ? ' — ' + plan : ''}! You now have unlimited access.`;
            spinnerEl.style.display = 'none';
            actionEl.style.display  = 'block';
            actionEl.innerHTML = `<a href="/dashboard.html" class="btn-dashboard">Go to Dashboard →</a>`;
            // Auto redirect after 3s
            setTimeout(() => { window.location.href = '/dashboard.html'; }, 3000);
        }

        function showError(message) {
            iconEl.textContent    = '❌';
            titleEl.textContent   = 'Payment Failed';
            titleEl.classList.add('error-state');
            msgEl.textContent     = message || 'Something went wrong. Please try again or contact support.';
            spinnerEl.style.display = 'none';
            actionEl.style.display  = 'block';
            actionEl.innerHTML = `
                <a href="/subscribe.html" class="btn-dashboard" style="background:#dc2626;">
                    Try Again
                </a>
                <br>
                <a href="/dashboard.html" style="display:block;margin-top:12px;color:#666;font-size:0.85rem;">
                    Back to Dashboard
                </a>
            `;
        }

        // ✅ Get reference from URL params (Paystack appends ?reference=xxx&trxref=xxx)
        const urlParams = new URLSearchParams(window.location.search);
        const reference = urlParams.get('reference')
                       || urlParams.get('trxref')
                       || localStorage.getItem('wize_paystack_ref');

        if (!reference) {
            showError('No payment reference found. Please try subscribing again.');
            return;
        }

        // Clean URL
        window.history.replaceState({}, document.title, window.location.pathname);

        try {
            const token    = getAuthToken();
            const response = await fetch(
                `${BACKEND_URL}/api/billing/verify?reference=${encodeURIComponent(reference)}`,
                { headers: { 'Authorization': `Bearer ${token}` } }
            );
            const data = await response.json();

            if (data.success) {
                // ✅ Clear stored reference
                localStorage.removeItem('wize_paystack_ref');

                // ✅ Update local user as premium
                const user = getCurrentUser();
                if (user) {
                    user.isPaidUser = true;
                    setAuthData(getAuthToken(), user);
                }

                showSuccess(data.plan);
            } else {
                localStorage.removeItem('wize_paystack_ref');
                showError(data.message || 'Payment verification failed.');
            }
        } catch (error) {
            console.error('Callback verification error:', error);
            showError('Connection error during verification. Please contact support.');
        }
    });
    </script>
</body>
</html>
